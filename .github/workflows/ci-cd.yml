name: ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; the release job opts into `contents: write` itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pre-push hook runs this same scan, but the hook needs
  # `git config core.hooksPath .githooks` per clone and a fresh clone has it
  # off — so a public repo gets the scan here too, where nothing can forget it.
  privacy:
    name: privacy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the scan needs the base commit, not just the tip

      - name: Scan pushed changes for secrets / personal data
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          # The PR's own head, not `github.sha`: on a pull_request run that is the
          # synthetic refs/pull/N/merge commit GitHub creates, authored with the
          # account's primary (real) address, so the identity check refused every
          # PR regardless of its contents. A push run has no pull_request and falls
          # back to github.sha, which is then a real commit — a merge made on
          # GitHub still gets its identity checked there.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # $USER/$HOME/hostname here are the runner's ("runner", "/home/runner"),
          # not the developer's, so those patterns would only match innocuous text.
          PRIVACY_CHECK_SKIP_IDENTITY: '1'
          # Private literals the scan must refuse but no committed file may hold
          # (a real name, personal addresses, institution domains), one per line.
          # Optional: an unset secret is an empty denylist, and a fork's PR gets none.
          PRIVACY_CHECK_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          set -euo pipefail
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904

          if [ "$EVENT_NAME" = pull_request ]; then
            candidate="$PR_BASE"
          else
            candidate="${PUSH_BEFORE:-}"
          fi

          # merge-base, not the raw candidate: it keeps a force-push or a stale
          # PR base from widening the diff into unrelated history. Falling back
          # through origin/main to the empty tree means a new branch or a tag
          # push still gets scanned rather than silently skipped.
          base=""
          if [ -n "$candidate" ] && ! [[ "$candidate" =~ ^0+$ ]]; then
            base="$(git merge-base "$candidate" "$HEAD_SHA" 2>/dev/null || true)"
          fi
          [ -n "$base" ] || base="$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)"
          [ -n "$base" ] || base="$empty_tree"

          echo "Scanning ${base}..${HEAD_SHA}"
          scripts/privacy-check.sh "$base" "$HEAD_SHA"

  # The app's name is spelled in the brand modules only (src-tauri/src/brand.rs,
  # src/lib/brand.ts, scripts/lib/brand.sh); everything else reads it from
  # there. This fails when a tracked file outside the script's commented
  # allowlist spells it itself. No hook runs it, so CI is where it is enforced.
  brand:
    name: brand
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that only the brand modules spell the app's name
        run: scripts/brand-check.sh

  # gitleaks over the whole history, next to privacy-check.sh (which scans only
  # the pushed range, for this repo's own private literals). The two overlap on
  # purpose: gitleaks knows far more issuer token formats. Blocking: history is
  # clean once .gitleaksignore's triaged false positives are applied, so a
  # failure here is a new finding to look at, and the release job waits on it.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan every commit, not just the tip

      # The release binary, not gitleaks-action: the action needs a paid
      # license key on organization accounts. Checksum pinned to the version.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # --redact keeps a real hit's value out of the public job log.
      - name: Scan history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'

  # Mechanical quality gate (TODO group Y #163). Linux-only on purpose: neither
  # linter's verdict is platform-dependent, so running it three times would cost
  # three times as much to learn the same thing.
  #
  # `cargo fmt --check` is deliberately NOT here yet — the backend has never been
  # rustfmt'd and differs at ~1069 sites, and raising max_width does not shrink
  # that (rustfmt disagrees with the hand-wrapping in both directions). Adding it
  # needs a one-off formatting commit first; see #163.
  lint:
    name: lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  test-windows:
    name: test-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  test-macos:
    name: test-macos
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Staged gate: the macOS-only arms have never been linted (nothing that
      # lints on Linux can compile them), so the first runs are expected to
      # report findings. Fix what it prints, then remove `continue-on-error`.
      - name: Lint backend (clippy, staged)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  package-windows:
    name: package-windows
    runs-on: windows-latest
    if: github.event_name == 'push'
    # `privacy` gates every package job: a build that leaks must never become a
    # downloadable artifact, let alone a release asset.
    needs: [test-windows, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-windows-nsis
          # Tauri 2 on Windows puts bundles in the project-root target/ when
          # CARGO_TARGET_DIR is overridden by swatinem/rust-cache.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe

  # Pinned to 24.04, not `ubuntu-latest`: the runner distro is an input to the
  # shipped artifact, so it should move when we say so, not when GitHub reflags
  # the alias mid-release.
  #
  # The Linux bundles link against the runner's glibc, and that sets the
  # *minimum* glibc the .AppImage/.deb will run on. 24.04 means glibc 2.39, up
  # from 22.04's 2.35: Ubuntu 24.04+, Debian 13+, Fedora 40+ are fine, and
  # anything older (Ubuntu 22.04, Debian 12) is deliberately dropped. A
  # `GLIBC_2.xx not found` loader report is this line, not a code bug — the fix
  # would be a container/sysroot build here, not moving the whole workflow back.
  package:
    name: package
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: [test, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles
        env:
          # 24.04 restricts unprivileged user namespaces via AppArmor, so
          # linuxdeploy/appimagetool cannot FUSE-mount themselves. Extracting
          # instead is the supported workaround and is a no-op elsewhere.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:bundle

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-appimage
          # Project-root target/ is a fallback for when CARGO_TARGET_DIR is
          # overridden by swatinem/rust-cache.
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage

      - name: Upload DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-deb
          # Project-root target/ is a fallback for when CARGO_TARGET_DIR is
          # overridden by swatinem/rust-cache.
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb

  package-macos:
    name: package-macos
    runs-on: macos-latest
    if: github.event_name == 'push'
    needs: [test-macos, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles
        # Unsigned alpha .dmg (matches the unsigned Windows NSIS today). macOS
        # bundle/window overrides come from src-tauri/tauri.macos.conf.json,
        # which Tauri auto-merges on macOS. To ship a signed + notarized build
        # later, import an Apple Developer cert into a keychain in a step above
        # and set APPLE_SIGNING_IDENTITY + APPLE_ID + APPLE_PASSWORD +
        # APPLE_TEAM_ID (or APPLE_API_KEY_ID/APPLE_API_ISSUER/APPLE_API_KEY_PATH)
        # from repo secrets here before running the build.
        run: npm run tauri:build -- --bundles dmg --target universal-apple-darwin

      - name: Rename universal DMG
        run: |
          # Only one of these roots exists (rust-cache redirects CARGO_TARGET_DIR
          # to the project root), and find exits 1 on the missing one — which the
          # step's `bash -e` would treat as fatal before `test -n` ever runs.
          dmg="$(find src-tauri/target target -path '*/universal-apple-darwin/release/bundle/dmg/*.dmg' -print -quit 2>/dev/null || true)"
          test -n "$dmg"
          # Name the published asset by version, like the AppImage/deb/exe
          # bundles do — naming it by commit sha made the macOS asset the only
          # one a user couldn't match to a release at a glance. Guard the move:
          # Tauri may already emit exactly this name, and `mv x x` fails.
          version="$(node -p "require('./package.json').version")"
          target="$(dirname "$dmg")/Tabtivity_${version}_universal.dmg"
          [ "$dmg" = "$target" ] || mv "$dmg" "$target"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-macos-universal-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*universal.dmg
            target/universal-apple-darwin/release/bundle/dmg/*universal.dmg

  release:
    name: release
    runs-on: ubuntu-24.04
    needs: [secrets, package, package-windows, package-macos]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.secrets.result == 'success' &&
      (
        needs.package.result == 'success' ||
        needs.package-windows.result == 'success' ||
        needs.package-macos.result == 'success'
      )
    permissions:
      contents: write

    steps:
      - name: Download AppImage artifact
        if: needs.package.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tabtivity-${{ github.sha }}-appimage
          path: release-assets

      - name: Download DEB artifact
        if: needs.package.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tabtivity-${{ github.sha }}-deb
          path: release-assets

      - name: Download Windows NSIS artifact
        if: needs.package-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tabtivity-${{ github.sha }}-windows-nsis
          path: release-assets

      - name: Download macOS DMG artifact
        if: needs.package-macos.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tabtivity-${{ github.sha }}-macos-universal-dmg
          path: release-assets

      - name: Build release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          LINUX_RESULT: ${{ needs.package.result }}
          WINDOWS_RESULT: ${{ needs.package-windows.result }}
          MACOS_RESULT: ${{ needs.package-macos.result }}
        run: |
          {
            printf 'Tabtivity %s — alpha / preview build.\n\n' "$RELEASE_TAG"
            printf 'Built from commit `%s`.\n\n' "$RELEASE_SHA"
            printf 'Artifacts:\n'

            if [ "$LINUX_RESULT" = success ]; then
              printf -- '- Linux: `.AppImage` (portable) and `.deb`\n'
            else
              printf -- '- Linux: unavailable (package job: `%s`)\n' "$LINUX_RESULT"
            fi

            if [ "$WINDOWS_RESULT" = success ]; then
              printf -- '- Windows: NSIS `.exe` installer\n'
            else
              printf -- '- Windows: unavailable (package job: `%s`)\n' "$WINDOWS_RESULT"
            fi

            if [ "$MACOS_RESULT" = success ]; then
              printf -- '- macOS: universal Intel/Apple Silicon `.dmg` (unsigned — right-click → Open, or run '
              printf '`xattr -dr com.apple.quarantine /Applications/Tabtivity.app`)\n'
            else
              printf -- '- macOS: unavailable (package job: `%s`)\n' "$MACOS_RESULT"
            fi

            # Until the cleanup release (the one that drops the old-name
            # lookups): what an upgrade across the rename does and asks for.
            printf '\nTabtivity was called Eldrun before. Upgrading from an Eldrun build:\n'
            printf -- '- your state is moved to the new name on the first start (projects stay where they are); '
            printf 'close the old window before installing, and update all machines that sync with each other together\n'
            printf -- '- agents may ask once more for permission to use the app'"'"'s tools, and Codex to trust its session hook\n'
            printf -- '- `eldrun-send` keeps working for one release as an alias of `tabtivity-send`\n'
            printf -- '- macOS: delete the old `Eldrun.app` yourself; a pinned launcher of the old entry has to be pinned again\n'
            printf '\nThis is an early alpha; expect rough edges.\n'
          } > release-body.md

      # Only the public key: the job verifies its own signature against the
      # key the updater has compiled in, so a wrong secret fails here instead
      # of shipping a release no installed Tabtivity will accept.
      - name: Check out the release public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src-tauri/release-signing.pub.pem
          sparse-checkout-cone-mode: false
          path: repo

      # The in-app updater installs nothing unless its SHA-256 is in this
      # signed list (#160, services::app_update). No secret → no release.
      - name: Sign release checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set; refusing to publish an unsigned release"
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing.key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) \
            | sort | while read -r f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
              done > SHA256SUMS
          test -s SHA256SUMS
          if [ "$(cut -d' ' -f3 SHA256SUMS | sort | uniq -d)" != "" ]; then
            echo "::error::two release assets share a name"
            exit 1
          fi
          cat SHA256SUMS
          openssl dgst -sha256 -sign "$key" -out SHA256SUMS.sig SHA256SUMS
          openssl dgst -sha256 -verify repo/src-tauri/release-signing.pub.pem \
            -signature SHA256SUMS.sig SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Publish as a full release so the newest tag becomes GitHub's
          # "Latest" — a pre-release never does, which left the releases page
          # with no latest build and the README's /releases/latest link stale.
          # The notes still say alpha; this flag is about discoverability.
          prerelease: false
          body_path: release-body.md
          fail_on_unmatched_files: false
          # Recursive globs: the upload steps list two path patterns, so
          # upload-artifact roots each artifact at the workspace dir and the
          # bundle ends up nested (e.g. target/release/bundle/appimage/*.AppImage)
          # rather than at the artifact root.
          files: |
