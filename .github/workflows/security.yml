name: security

# Security scans (ROADMAP "Security pass"): dependency advisories and SAST. Its
# own workflow rather than jobs in ci-cd.yml so it can also run on a schedule:
# advisories and new CodeQL queries arrive against code that has not changed,
# and a cron on ci-cd.yml would rebuild every package to learn nothing new.
# The gitleaks scan lives in ci-cd.yml instead: history only changes on a push,
# so it gains nothing from the cron, and there it can gate the release job.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # Mondays, 05:17 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Blocking: a new advisory fails the run. Fix it by updating the crate or
    # package; if no fix exists, ignore it below with a reason, as for `rsa`.
    # The weekly schedule means this can go red with no code change.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      # Reads the committed workspace Cargo.lock at the repo root; no build, no
      # system packages. Unmaintained/unsound/yanked crates print as warnings
      # and do not fail.
      #
      # Ignored, each with its reason — add one only with a comment like these:
      # - RUSTSEC-2023-0071 `rsa` Marvin timing oracle: `pgp` pulls `rsa` in
      #   unconditionally and no patched version exists. Mitigated by defaulting
      #   key generation to Curve25519; see the note on `pgp` in Cargo.toml.
      # - RUSTSEC-2026-0367/0368/0369 `zip` 8.6 `extract()` symlink/SUID flaws,
      #   patched in 9: our own `zip` is 9, but `calamine` (spreadsheet reading,
      #   no newer release) still pulls 8.6. It only reads entries through
      #   `ZipArchive` and never calls `extract()`. Drop these when `calamine`
      #   moves to zip 9.
      - name: Audit Rust dependencies
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369

      # The release binary, checksum pinned to the version, as for gitleaks in
      # ci-cd.yml.
      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$name/cargo-deny"

      # What the tree may contain, by deny.toml: licenses the shipped app can
      # carry, crates from crates.io only (a git or other-registry dependency
      # is a new trust root), no `*` requirements. Advisories stay with
      # cargo-audit above.
      - name: Check Rust licenses and sources
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/cargo-deny" --locked check bans licenses sources'

      # --omit=dev: only what ships in the bundle. Vite, vitest and eslint never
      # reach a user, so their advisories are noise here.
      # `!cancelled()` so a Rust finding still leaves the npm report in the log.
      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev

  # zizmor over the workflows and dependabot.yml: tokens left in .git/config,
  # template injection, over-broad permissions, dangerous triggers, and —
  # online, with the job's token — a pinned SHA that is not on the action's
  # repository (an impostor commit) or an action version with an advisory.
  # Blocking, unlike CodeQL's `actions` pack below (which overlaps on
  # purpose): a finding is fixed, or ignored in .github/zizmor.yml or inline
  # with its reason. The weekly schedule means a new advisory can turn it red
  # with no change here.
  workflows:
    name: workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          set -euo pipefail
          tarball=zizmor-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/$tarball"
          echo "$ZIZMOR_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" zizmor

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" --format github .github'

  # SAST. Findings land in the repo's Security → Code scanning tab, not in the
  # job result: analyze succeeds whatever it finds, so this never blocks a push.
  # build-mode none: all three extract from source, so the job needs neither
  # the WebKitGTK packages nor a cargo build.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans these workflow files themselves (injection via
        # untrusted event fields, over-broad tokens).
        language: [javascript-typescript, rust, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: failure-only

      # Exact rule + location + source hash; an edit expires the review.
      # No query or source tree is excluded from analysis. The original
      # reviewed results and reasons remain in reviewed-results.json.
      - name: Apply reviewed false positives
        run: |
          python3 -m unittest discover -s scripts -p test_codeql_reviewed.py
          python3 scripts/codeql_reviewed.py "$RUNNER_TEMP/codeql-results"

      - name: Upload analysis
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}

      - name: Preserve reviewed findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-reviewed-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/reviewed-results.json
          if-no-files-found: ignore
          retention-days: 30
