# Version-update PRs, onto develop (main is reached only by PR, and a merge
# into it is a release). One grouped PR per ecosystem for minor and patch
# updates; a major update comes as its own PR.
#
# cooldown: a version is proposed only once it has been public for a week
# (majors a month). Most hijacked releases are found and pulled within days,
# so this keeps them out of the lockfiles. Security updates ignore it.
#
# Left to a hand update (docs/third_party_update_checklist.md §19), so never
# proposed here:
#   - Tauri and its runtime: tauri-runtime-wry is a patched copy
#     (src-tauri/patches/, root Cargo.toml [patch.crates-io]) that a bump has
#     to re-copy and re-patch, and the Rust and JS halves move together.
#   - @tauri-apps/*: src/lib/transport/wsInternals.ts re-implements their
#     internals, to be diffed against each new version.
#   - webkit2gtk: pinned exactly (`=`), on purpose.
version: 2
updates:
  # Every action is pinned to a commit SHA with its version as a comment;
  # this keeps the pins moving.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tauri"
      - dependency-name: "tauri-*"
      - dependency-name: "wry"
      - dependency-name: "tao"
      - dependency-name: "webkit2gtk"
    groups:
      cargo:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@tauri-apps/*"
    groups:
      npm:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
