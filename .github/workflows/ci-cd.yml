name: ci-cd

# Branch pushes only: a v* tag is not built again here. Releases are cut by
# release.yml from a commit this workflow already passed on its branch push,
# out of the bundles that very run built (the package jobs' artifacts).
# Dependabot's branches run as their pull request only: a push run of one
# would also build every package for a branch nothing releases.
on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch (or commit on a PR) cancels the run it supersedes,
# so a red run's fix doesn't queue behind it. Never on main: release.yml
# releases only a main commit whose run passed, and waits for that run.
concurrency:
  group: ci-cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The Rust every job installs: the version rust-toolchain.toml pins, so CI
  # lints and tests with exactly the compiler and clippy developers run (the
  # lint job checks the two agree). Bump both together.
  RUST_TOOLCHAIN: "1.99.0"

# Every job's timeout-minutes is about one and a half to two times its longest
# green run (2026-10), so a hung test fails the job instead of holding the
# runner for GitHub's six-hour default (and release.yml's two-hour wait).
#
# `npm ci --ignore-scripts`: no dependency's install script runs here, where
# a compromised package's postinstall would execute with the job's token and
# secrets. The lock's only install script is fsevents' (a rebuild of a
# prebuilt binary). A new dependency that truly needs its script fails
# loudly here.
jobs:
  # The pre-push hook runs this same scan, but the hook needs
  # `git config core.hooksPath .githooks` per clone and a fresh clone has it
  # off — so a public repo gets the scan here too, where nothing can forget it.
  privacy:
    name: privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the scan needs the base commit, not just the tip

      - name: Scan pushed changes for secrets / personal data
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          # The PR's own head, not `github.sha`: on a pull_request run that is the
          # synthetic refs/pull/N/merge commit GitHub creates, authored with the
          # account's primary (real) address, so the identity check refused every
          # PR regardless of its contents. A push run has no pull_request and falls
          # back to github.sha, which is then a real commit — a merge made on
          # GitHub still gets its identity checked there.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # $USER/$HOME/hostname here are the runner's ("runner", "/home/runner"),
          # not the developer's, so those patterns would only match innocuous text.
          PRIVACY_CHECK_SKIP_IDENTITY: '1'
          # Private literals the scan must refuse but no committed file may hold
          # (a real name, personal addresses, institution domains), one per line.
          # Optional: an unset secret is an empty denylist, and a fork's PR gets none.
          PRIVACY_CHECK_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          set -euo pipefail
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904

          if [ "$EVENT_NAME" = pull_request ]; then
            candidate="$PR_BASE"
          else
            candidate="${PUSH_BEFORE:-}"
          fi

          # merge-base, not the raw candidate: it keeps a force-push or a stale
          # PR base from widening the diff into unrelated history. Falling back
          # through origin/main to the empty tree means a new branch or a tag
          # push still gets scanned rather than silently skipped.
          base=""
          if [ -n "$candidate" ] && ! [[ "$candidate" =~ ^0+$ ]]; then
            base="$(git merge-base "$candidate" "$HEAD_SHA" 2>/dev/null || true)"
          fi
          [ -n "$base" ] || base="$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)"
          [ -n "$base" ] || base="$empty_tree"

          echo "Scanning ${base}..${HEAD_SHA}"
          scripts/privacy-check.sh "$base" "$HEAD_SHA"

  # The app's name is spelled in the brand modules only (src-core/src/brand.rs,
  # src/lib/brand.ts, scripts/lib/brand.sh); everything else reads it from
  # there. This fails when a tracked file outside the script's commented
  # allowlist spells it itself. No hook runs it, so CI is where it is enforced.
  brand:
    name: brand
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that only the brand modules spell the app's name
        run: scripts/brand-check.sh

  # gitleaks over the whole history, next to privacy-check.sh (which scans only
  # the pushed range, for this repo's own private literals). The two overlap on
  # purpose: gitleaks knows far more issuer token formats. Blocking: history is
  # clean once .gitleaksignore's triaged false positives are applied, so a
  # failure here is a new finding to look at, and fails the run release.yml
  # waits for.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # scan every commit, not just the tip

      # The release binary, not gitleaks-action: the action needs a paid
      # license key on organization accounts. Checksum pinned to the version.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # --redact keeps a real hit's value out of the public job log.
      - name: Scan history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'

  # Mechanical quality gate (TODO group Y #163). Linux-only on purpose: neither
  # linter's verdict is platform-dependent, so running it three times would cost
  # three times as much to learn the same thing.
  #
  # `cargo fmt --check` is deliberately NOT here yet — the backend has never been
  # rustfmt'd and differs at ~1069 sites, and raising max_width does not shrink
  # that (rustfmt disagrees with the hand-wrapping in both directions). Adding it
  # needs a one-off formatting commit first; see #163.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: CI's Rust is the pinned one
        shell: bash
        run: |
          pinned="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
          if [ "$pinned" != "$RUST_TOOLCHAIN" ]; then
            echo "::error::rust-toolchain.toml pins $pinned but ci-cd.yml installs $RUST_TOOLCHAIN; bump both together."
            exit 1
          fi

      # scripts/ci-local.sh runs this workflow's Linux steps before a push;
      # this fails when a step here is neither mirrored there nor on its
      # allowlist, so the local run cannot fall behind CI unnoticed.
      - name: ci-local.sh mirrors this workflow
        run: bash scripts/ci-local.sh --check-drift

      - name: Lint frontend
        run: npm run lint

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Lint core crate
        run: cargo clippy --manifest-path src-core/Cargo.toml --all-targets -- -D warnings

      - name: Lint gateway crate
        run: cargo clippy --manifest-path src-gateway/Cargo.toml --all-targets -- -D warnings

      # The server daemon's build of the library: no `desktop` feature, so no
      # Tauri/GTK/X11/libdbus (hosted plan §3.2, TODO #2349). Built alone, or
      # Cargo would unify the desktop's features into it.
      - name: Lint the daemon's build of the library
        run: cargo clippy -p tabtivity --no-default-features --lib -- -D warnings

      - name: Lint daemon crate
        run: cargo clippy -p app-serverd --all-targets -- -D warnings

  test-ubuntu:
    name: test-ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Fail fast: what failed in this branch's last run on this OS runs
      # before anything else (scripts/ci-failed-first.sh), and the full
      # suites below record what fails for the next run.
      - name: Restore the last run's failed tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-failed
          key: ci-failed-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-failed-${{ runner.os }}-${{ github.ref_name }}-
            ci-failed-${{ runner.os }}-

      - name: Re-run the last run's failed tests first
        shell: bash
        run: bash scripts/ci-failed-first.sh previous

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        shell: bash
        run: bash scripts/ci-failed-first.sh frontend

      - name: Run backend tests
        shell: bash
        run: bash scripts/ci-failed-first.sh backend

      - name: Save this run's failed tests
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-failed
          key: ci-failed-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run core crate tests
        run: cargo test --manifest-path src-core/Cargo.toml

      - name: Run gateway crate tests
        run: cargo test --manifest-path src-gateway/Cargo.toml

      # The library as the server daemon builds it (no `desktop` feature):
      # code compiled only there (the vault-only credential paths, the
      # headless platform stubs) is tested where it runs, plus the secrets
      # end-to-end test against that build.
      - name: Run the daemon build's library tests
        run: cargo test -p tabtivity --no-default-features --lib --test server_secrets

      # The daemon links no window toolkit: built on its own, `ldd` must name
      # no GTK, GDK, WebKit, X11/xcb or libdbus library (TODO #2349).
      - name: Daemon links no desktop libraries
        run: |
          cargo build -p app-serverd
          daemon=$(ls target/debug/*-serverd)
          ldd "$daemon"
          if ldd "$daemon" | grep -Ei 'gtk|gdk|webkit|javascriptcore|libx11|xcb|dbus|soup|ayatana'; then
            echo "the server daemon links a desktop library" >&2
            exit 1
          fi

  # windows-2025 and macos-26, not the -latest aliases, for the reason the
  # package job's comment gives for ubuntu-24.04: the runner image is an input
  # to the shipped .exe and .dmg. They are what -latest named in 2026-10.
  test-windows:
    name: test-windows
    runs-on: windows-2025
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Fail fast: what failed in this branch's last run on this OS runs
      # before anything else (scripts/ci-failed-first.sh), and the full
      # suites below record what fails for the next run.
      - name: Restore the last run's failed tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-failed
          key: ci-failed-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-failed-${{ runner.os }}-${{ github.ref_name }}-
            ci-failed-${{ runner.os }}-

      - name: Re-run the last run's failed tests first
        shell: bash
        run: bash scripts/ci-failed-first.sh previous

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        shell: bash
        run: bash scripts/ci-failed-first.sh frontend

      - name: Run backend tests
        shell: bash
        run: bash scripts/ci-failed-first.sh backend

      - name: Save this run's failed tests
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-failed
          key: ci-failed-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run core crate tests
        run: cargo test --manifest-path src-core/Cargo.toml

      # The server crates (gateway, daemon) are Linux-only but must still
      # compile here, tests included, so the workspace builds on every OS.
      - name: Check the whole workspace, tests included
        run: cargo check --workspace --all-targets

      # Staged gate: the Windows-only arms were linted locally through the
      # cross-target shims (zero findings), but never yet on a real Windows
      # runner. Once a run here is green, remove `continue-on-error`.
      - name: Lint backend (clippy, staged)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  test-macos:
    name: test-macos
    runs-on: macos-26
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Fail fast: what failed in this branch's last run on this OS runs
      # before anything else (scripts/ci-failed-first.sh), and the full
      # suites below record what fails for the next run.
      - name: Restore the last run's failed tests
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-failed
          key: ci-failed-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-failed-${{ runner.os }}-${{ github.ref_name }}-
            ci-failed-${{ runner.os }}-

      - name: Re-run the last run's failed tests first
        shell: bash
        run: bash scripts/ci-failed-first.sh previous

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        shell: bash
        run: bash scripts/ci-failed-first.sh frontend

      - name: Run backend tests
        shell: bash
        run: bash scripts/ci-failed-first.sh backend

      - name: Save this run's failed tests
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-failed
          key: ci-failed-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run core crate tests
        run: cargo test --manifest-path src-core/Cargo.toml

      # The server crates (gateway, daemon) are Linux-only but must still
      # compile here, tests included, so the workspace builds on every OS.
      - name: Check the whole workspace, tests included
        run: cargo check --workspace --all-targets

      # Staged gate: the macOS-only arms were linted locally only through
      # check-only `cc`/`ar` stand-ins (zero findings), never on a real Mac.
      # Fix what it prints, then remove `continue-on-error`.
      - name: Lint backend (clippy, staged)
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  package-windows:
    name: package-windows
    runs-on: windows-2025
    timeout-minutes: 50
    if: github.event_name == 'push'
    # `privacy` gates every package job: a build that leaks must never become a
    # downloadable artifact, let alone a release asset.
    needs: [test-windows, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build release bundles
        run: npm run tauri:build -- --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-windows-nsis
          # Tauri 2 on Windows puts bundles in the project-root target/ when
          # CARGO_TARGET_DIR is overridden by swatinem/rust-cache.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe

  # Pinned to 24.04, not `ubuntu-latest`: the runner distro is an input to the
  # shipped artifact, so it should move when we say so, not when GitHub reflags
  # the alias mid-release.
  #
  # The Linux bundles link against the runner's glibc, and that sets the
  # *minimum* glibc the .AppImage/.deb will run on. 24.04 means glibc 2.39, up
  # from 22.04's 2.35: Ubuntu 24.04+, Debian 13+, Fedora 40+ are fine, and
  # anything older (Ubuntu 22.04, Debian 12) is deliberately dropped. A
  # `GLIBC_2.xx not found` loader report is this line, not a code bug — the fix
  # would be a container/sysroot build here, not moving the whole workflow back.
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.event_name == 'push'
    needs: [test-ubuntu, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build release bundles
        env:
          # 24.04 restricts unprivileged user namespaces via AppArmor, so
          # linuxdeploy/appimagetool cannot FUSE-mount themselves. Extracting
          # instead is the supported workaround and is a no-op elsewhere.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:bundle

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-appimage
          # Project-root target/ is a fallback for when CARGO_TARGET_DIR is
          # overridden by swatinem/rust-cache.
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage

      - name: Upload DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-deb
          # Project-root target/ is a fallback for when CARGO_TARGET_DIR is
          # overridden by swatinem/rust-cache.
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb

  # The server's .deb (gateway, per-user daemon, admin helper, web bundles),
  # released next to the desktop bundles. Same runner as `package` for the
  # same glibc reason; the package's Depends names the glibc it was built
  # against. x86_64 only for now.
  package-server:
    name: package-server
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.event_name == 'push'
    needs: [test-ubuntu, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build server package
        run: scripts/package-server-deb.sh

      - name: Upload server DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-server-deb
          path: target/release/bundle/server/*.deb
          if-no-files-found: error

  package-macos:
    name: package-macos
    runs-on: macos-26
    timeout-minutes: 60
    if: github.event_name == 'push'
    needs: [test-macos, privacy, brand]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build release bundles
        # Unsigned alpha .dmg (matches the unsigned Windows NSIS today). macOS
        # bundle/window overrides come from src-tauri/tauri.macos.conf.json,
        # which Tauri auto-merges on macOS. To ship a signed + notarized build
        # later, import an Apple Developer cert into a keychain in a step above
        # and set APPLE_SIGNING_IDENTITY + APPLE_ID + APPLE_PASSWORD +
        # APPLE_TEAM_ID (or APPLE_API_KEY_ID/APPLE_API_ISSUER/APPLE_API_KEY_PATH)
        # from repo secrets here before running the build.
        run: npm run tauri:build -- --bundles dmg --target universal-apple-darwin

      - name: Rename universal DMG
        run: |
          # Only one of these roots exists (rust-cache redirects CARGO_TARGET_DIR
          # to the project root), and find exits 1 on the missing one — which the
          # step's `bash -e` would treat as fatal before `test -n` ever runs.
          dmg="$(find src-tauri/target target -path '*/universal-apple-darwin/release/bundle/dmg/*.dmg' -print -quit 2>/dev/null || true)"
          test -n "$dmg"
          # Name the published asset by version, like the AppImage/deb/exe
          # bundles do — naming it by commit sha made the macOS asset the only
          # one a user couldn't match to a release at a glance. Guard the move:
          # Tauri may already emit exactly this name, and `mv x x` fails.
          version="$(node -p "require('./package.json').version")"
          target="$(dirname "$dmg")/Tabtivity_${version}_universal.dmg"
          [ "$dmg" = "$target" ] || mv "$dmg" "$target"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabtivity-${{ github.sha }}-macos-universal-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*universal.dmg
            target/universal-apple-darwin/release/bundle/dmg/*universal.dmg
