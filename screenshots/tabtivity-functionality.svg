<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Palette: Tabtivity's own light_lavender theme (src/styles/themes.css) —
       bg #faf9fe / panel #f2effa / elevated #fff, border #ddd6f0,
       text #2e2a3d · #5f5878 · #938bab, accent #7c5cdb,
       accent-secondary #9d6ecb, info #6d7fd4. -->
  <!-- card -->
  <rect x="8" y="8" width="944" height="864" rx="18" fill="#faf9fe" stroke="#ddd6f0" stroke-width="1.5"/>

  <!-- header -->
  <text x="32" y="42" font-size="19" font-weight="700" letter-spacing="2" fill="#2e2a3d">TABTIVITY</text>
  <text x="118" y="42" font-size="12.5" fill="#7c5cdb">·  you don't open applications, you open projects — and the project brings its machines</text>

  <!-- ===================== Band 1: projects ===================== -->
  <rect x="32" y="64" width="896" height="74" rx="12" fill="#f2effa" stroke="#ddd6f0"/>
  <text x="48" y="88" font-size="12" font-weight="700" letter-spacing="0.6" fill="#7c5cdb">① PROJECTS · PROJECT SWITCHING</text>
  <!-- active pill -->
  <rect x="48" y="100" width="128" height="28" rx="9" fill="#ece5fb" stroke="#b9a4ee"/>
  <text x="62" y="119" font-size="12" font-weight="600" fill="#5d3eb8">● Project A</text>
  <rect x="188" y="100" width="104" height="28" rx="9" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="202" y="119" font-size="12" fill="#5f5878">Project B</text>
  <rect x="304" y="100" width="104" height="28" rx="9" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="318" y="119" font-size="12" fill="#5f5878">Project C</text>
  <rect x="420" y="100" width="86" height="28" rx="9" fill="#f7eefb" stroke="#d3b3e6"/>
  <text x="434" y="119" font-size="12" fill="#7a4b96">▦ Box</text>
  <rect x="518" y="100" width="86" height="28" rx="9" fill="#f4f2f8" stroke="#ddd6f0"/>
  <text x="532" y="119" font-size="12" fill="#5f5878">▧ Trash</text>
  <rect x="616" y="100" width="34" height="28" rx="9" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="629" y="119" font-size="14" fill="#938bab">+</text>
  <rect x="662" y="100" width="176" height="28" rx="9" fill="#eaf0fb" stroke="#b9c8ee"/>
  <text x="676" y="119" font-size="11.5" fill="#3f5ba9">◉ runs on: cluster-login</text>
  <text x="912" y="92" text-anchor="end" font-size="12" fill="#5f5878">14:32</text>
  <text x="912" y="120" text-anchor="end" font-size="11" fill="#938bab">today · 2h 14m</text>

  <!-- arrow -->
  <line x1="480" y1="138" x2="480" y2="168" stroke="#c9c0e4" stroke-width="2"/>
  <path d="M480 174 l-6 -9 h12 z" fill="#c9c0e4"/>
  <text x="494" y="160" font-size="11" fill="#938bab">open a project → swap the whole desktop</text>

  <!-- ===================== Band 2: tabs ===================== -->
  <rect x="32" y="180" width="896" height="262" rx="12" fill="#f2effa" stroke="#ddd6f0"/>
  <text x="48" y="204" font-size="12" font-weight="700" letter-spacing="0.6" fill="#6d7fd4">② TAB MANAGEMENT · TILING SUBWINDOWS</text>

  <!-- tab strip -->
  <rect x="48" y="214" width="108" height="26" rx="8" fill="#ece5fb" stroke="#b9a4ee"/>
  <text x="62" y="231" font-size="11.5" font-weight="600" fill="#5d3eb8">▤ Claude</text>
  <rect x="162" y="214" width="78" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="176" y="231" font-size="11.5" fill="#5f5878">Codex</text>
  <rect x="246" y="214" width="78" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="260" y="231" font-size="11.5" fill="#5f5878">$ shell</text>
  <rect x="330" y="214" width="104" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="344" y="231" font-size="11.5" fill="#5f5878">◧ notes.md</text>
  <text x="912" y="231" text-anchor="end" font-size="11" fill="#938bab">drag-to-tile · split any direction · ⤢ pop-out</text>

  <!-- four cards -->
  <!-- card A: agent tabs -->
  <rect x="48" y="252" width="204" height="178" rx="10" fill="#ffffff" stroke="#ebe7f6"/>
  <text x="64" y="276" font-size="12" font-weight="700" fill="#7c5cdb">Agent tabs</text>
  <text x="64" y="300" font-size="11" fill="#5f5878">• Claude · Codex · Gemini</text>
  <text x="64" y="320" font-size="11" fill="#5f5878">• 26 built-in CLIs, one click</text>
  <text x="64" y="340" font-size="11" fill="#5f5878">• Ollama (local model)</text>
  <text x="64" y="360" font-size="11" fill="#5f5878">• your own custom agents</text>
  <text x="64" y="392" font-size="10.5" fill="#938bab">resumable sessions,</text>
  <text x="64" y="408" font-size="10.5" fill="#938bab">per-tab Plan / Auto mode</text>

  <!-- card B: shell tabs -->
  <rect x="268" y="252" width="204" height="178" rx="10" fill="#ffffff" stroke="#ebe7f6"/>
  <text x="284" y="276" font-size="12" font-weight="700" fill="#2e7d5b">Shell tabs</text>
  <text x="284" y="300" font-size="11" fill="#5f5878">• Root control terminal</text>
  <text x="284" y="320" font-size="11" fill="#5f5878">• Per-project shells</text>
  <text x="284" y="340" font-size="11" fill="#5f5878">• Remote (SSH) shells</text>
  <text x="284" y="360" font-size="11" fill="#5f5878">• Python run / debug</text>
  <text x="284" y="392" font-size="10.5" fill="#938bab">tmux-backed: a dropped</text>
  <text x="284" y="408" font-size="10.5" fill="#938bab">link doesn't kill the run</text>

  <!-- card C: native viewers -->
  <rect x="488" y="252" width="204" height="178" rx="10" fill="#ffffff" stroke="#ebe7f6"/>
  <text x="504" y="276" font-size="12" font-weight="700" fill="#9a6700">Native viewers</text>
  <text x="504" y="300" font-size="11" fill="#5f5878">• text · markdown · LaTeX</text>
  <text x="504" y="320" font-size="11" fill="#5f5878">• PDF · images · audio/video</text>
  <text x="504" y="340" font-size="11" fill="#5f5878">• CSV/XLSX · notebook · diff</text>
  <text x="504" y="360" font-size="11" fill="#5f5878">• SQLite · YAML · BibTeX · ODT</text>
  <text x="504" y="392" font-size="10.5" fill="#938bab">edit in place; TeX and deck</text>
  <text x="504" y="408" font-size="10.5" fill="#938bab">files open as workspaces</text>

  <!-- card D: app tabs -->
  <rect x="708" y="252" width="204" height="178" rx="10" fill="#ffffff" stroke="#ebe7f6"/>
  <text x="724" y="276" font-size="12" font-weight="700" fill="#9d6ecb">App tabs (built in)</text>
  <text x="724" y="300" font-size="11" fill="#5f5878">• Browser (reader mode)</text>
  <text x="724" y="320" font-size="11" fill="#5f5878">• System monitor · GPU</text>
  <text x="724" y="340" font-size="11" fill="#5f5878">• Disk usage · network</text>
  <text x="724" y="360" font-size="11" fill="#5f5878">• Print manager · Skills</text>
  <text x="724" y="392" font-size="10.5" fill="#938bab">no window leaves the</text>
  <text x="724" y="408" font-size="10.5" fill="#938bab">project to get these</text>

  <!-- ===================== Band 3: panel + chrome ===================== -->
  <rect x="32" y="456" width="440" height="130" rx="12" fill="#f2effa" stroke="#ddd6f0"/>
  <text x="48" y="480" font-size="12" font-weight="700" letter-spacing="0.6" fill="#9d6ecb">RIGHT PANEL</text>
  <rect x="48" y="490" width="62" height="26" rx="8" fill="#f7eefb" stroke="#d3b3e6"/>
  <text x="62" y="507" font-size="11.5" font-weight="600" fill="#7a4b96">Files</text>
  <rect x="118" y="490" width="56" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="132" y="507" font-size="11.5" fill="#5f5878">Git</text>
  <rect x="182" y="490" width="78" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="196" y="507" font-size="11.5" fill="#5f5878">Search</text>
  <rect x="268" y="490" width="66" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/>
  <text x="282" y="507" font-size="11.5" fill="#5f5878">Apps</text>
  <text x="48" y="540" font-size="11" fill="#5f5878">• git status markers · branch checkout · commit</text>
  <text x="48" y="558" font-size="11" fill="#5f5878">• project-wide content search · copy / cut / paste</text>
  <text x="48" y="578" font-size="10.5" fill="#938bab">plus downloads, alerts, sessions and cluster jobs on demand</text>

  <rect x="488" y="456" width="440" height="130" rx="12" fill="#f2effa" stroke="#ddd6f0"/>
  <text x="504" y="480" font-size="12" font-weight="700" letter-spacing="0.6" fill="#6d7fd4">HEADER · GLOBAL APP TOOLBAR</text>
  <text x="504" y="506" font-size="11" fill="#5f5878">• Mail · calendar · to-do board — Tabtivity's own, not a launcher</text>
  <text x="504" y="526" font-size="11" fill="#5f5878">• Machines · VPN · phone · battery · clock</text>
  <text x="504" y="546" font-size="11" fill="#5f5878">• Browser · notes · screenshot ▸ region · recorder · chat</text>
  <text x="504" y="576" font-size="10.5" fill="#938bab">the toolbar follows you between projects; the indicators are global</text>

  <!-- ===================== Band 4: desktop layer ===================== -->
  <rect x="32" y="600" width="896" height="104" rx="12" fill="#f2effa" stroke="#ddd6f0"/>
  <text x="48" y="624" font-size="12" font-weight="700" letter-spacing="0.6" fill="#7c5cdb">③ PROJECT DESKTOP LAYER — switches as one unit</text>

  <g font-size="11" fill="#5f5878">
    <rect x="48"  y="634" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="62"  y="651">Window parking</text>
    <rect x="264" y="634" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="278" y="651">Default-app mapping</text>
    <rect x="480" y="634" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="494" y="651">Time tracking · daily recap</text>
    <rect x="696" y="634" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="710" y="651">External window tracking</text>
    <rect x="48"  y="668" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="62"  y="685">Project boxes</text>
    <rect x="264" y="668" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="278" y="685">Trash project (disposable)</text>
    <rect x="480" y="668" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="494" y="685">Publish to GitHub</text>
    <rect x="696" y="668" width="200" height="26" rx="8" fill="#ffffff" stroke="#ddd6f0"/><text x="710" y="685">Pop-out windows</text>
  </g>

  <!-- ===================== Band 5: machines ===================== -->
  <rect x="32" y="718" width="896" height="104" rx="12" fill="#f2effa" stroke="#ddd6f0"/>
  <text x="48" y="742" font-size="12" font-weight="700" letter-spacing="0.6" fill="#6d7fd4">④ MACHINE LAYER — the same project on an SSH host, GPU box, HPC cluster, container or VM</text>

  <g font-size="11" fill="#3f5ba9">
    <rect x="48"  y="752" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="62"  y="769">Machine hub · live CPU/GPU</text>
    <rect x="264" y="752" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="278" y="769">Tabs run on the host (ssh -tt)</text>
    <rect x="480" y="752" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="494" y="769">Files over SFTP · no mount</text>
    <rect x="696" y="752" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="710" y="769">Git lockstep + byte-sync</text>
    <rect x="48"  y="786" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="62"  y="803">Many hosts per project</text>
    <rect x="264" y="786" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="278" y="803">tmux · runs survive drops</text>
    <rect x="480" y="786" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="494" y="803">SLURM: sbatch · squeue · srun</text>
    <rect x="696" y="786" width="200" height="26" rx="8" fill="#eaf0fb" stroke="#cdd6f2"/><text x="710" y="803">HPC workspaces (parallel FS)</text>
  </g>

  <!-- footer -->
  <text x="480" y="848" text-anchor="middle" font-size="11" fill="#938bab">Linux (X11 · KDE Wayland) + Windows · Tabtivity Mobile PWA over your own tailnet · Tauri 2 + React + TypeScript</text>
</svg>
